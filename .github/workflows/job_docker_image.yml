name: Docker Image Workflow

on:
  workflow_call:
    inputs:
      image-name:
        description: "Docker Image Name"
        required: true
        type: string
      image-tag:
        description: "Docker Image Tag"
        required: true
        type: string
      dockerhub-username:
        description: "DockerHub Username"
        required: false
        type: string
      github-owner:
        description: "GitHub Owner (for GitHub Packages)"
        required: false
        type: string
    secrets:
      DOCKERHUB_TOKEN:
        required: false

jobs:
  build_scan_and_push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ${{ inputs.image-name }}
      IMAGE_TAG: ${{ inputs.image-tag }}
      DOCKERHUB_USERNAME: ${{ inputs.dockerhub-username }}
      GITHUB_OWNER: ${{ inputs.github-owner }}

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Log in to DockerHub
        if: inputs.dockerhub-username
        uses: docker/login-action@v3
        with:
          username: ${{ inputs.dockerhub-username }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Packages
        if: inputs.github-owner
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ inputs.github-owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -f Containerfile --label "org.opencontainers.image.revision=${GITHUB_SHA}" -t "${IMAGE_NAME}:${IMAGE_TAG}" .

      - name: Build frontend Docker image
        run: docker build -f frontend/Containerfile --label "org.opencontainers.image.revision=${GITHUB_SHA}" -t "${IMAGE_NAME}-frontend:${IMAGE_TAG}" ./frontend

      - name: Scan backend image for vulnerabilities
        uses: anchore/scan-action@v5
        with:
          image: ${{ inputs.image-name }}:${{ inputs.image-tag }}
          fail-build: true
          severity-cutoff: high
          output-format: table
          only-fixed: false

      - name: Scan frontend image for vulnerabilities
        uses: anchore/scan-action@v5
        with:
          image: ${{ inputs.image-name }}-frontend:${{ inputs.image-tag }}
          fail-build: true
          severity-cutoff: high
          output-format: table
          only-fixed: false

      - name: Push to DockerHub
        if: inputs.dockerhub-username
        run: |
          docker tag "${IMAGE_NAME}:${IMAGE_TAG}" "${DOCKERHUB_USERNAME}/${IMAGE_NAME}:${IMAGE_TAG}"
          docker tag "${IMAGE_NAME}-frontend:${IMAGE_TAG}" "${DOCKERHUB_USERNAME}/${IMAGE_NAME}-frontend:${IMAGE_TAG}"
          docker push "${DOCKERHUB_USERNAME}/${IMAGE_NAME}:${IMAGE_TAG}"
          docker push "${DOCKERHUB_USERNAME}/${IMAGE_NAME}-frontend:${IMAGE_TAG}"

      - name: Push to GitHub Packages
        if: inputs.github-owner
        run: |
          docker tag "${IMAGE_NAME}:${IMAGE_TAG}" "ghcr.io/${GITHUB_OWNER}/${IMAGE_NAME}:${IMAGE_TAG}"
          docker tag "${IMAGE_NAME}-frontend:${IMAGE_TAG}" "ghcr.io/${GITHUB_OWNER}/${IMAGE_NAME}-frontend:${IMAGE_TAG}"
          docker push "ghcr.io/${GITHUB_OWNER}/${IMAGE_NAME}:${IMAGE_TAG}"
          docker push "ghcr.io/${GITHUB_OWNER}/${IMAGE_NAME}-frontend:${IMAGE_TAG}"

      - name: Record immutable release references
        if: inputs.github-owner
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          release = {"revision": os.environ["GITHUB_SHA"], "tag": os.environ["IMAGE_TAG"]}
          for component, suffix in (("backend", ""), ("frontend", "-frontend")):
              repository = f"ghcr.io/{os.environ['GITHUB_OWNER']}/{os.environ['IMAGE_NAME']}{suffix}"
              reference = f"{repository}:{os.environ['IMAGE_TAG']}"
              metadata = json.loads(subprocess.check_output(["docker", "image", "inspect", reference], text=True))[0]
              digests = [digest for digest in metadata["RepoDigests"] if digest.startswith(repository + "@sha256:")]
              if len(digests) != 1:
                  raise SystemExit(f"Expected exactly one published digest for {component}")
              release[component] = f"{reference}@{digests[0].split('@', 1)[1]}"
          Path("image-release.json").write_text(json.dumps(release, indent=2) + "\n")
          PY

      - name: Upload immutable release references
        if: inputs.github-owner
        uses: actions/upload-artifact@v4
        with:
          name: fitness-tracker-images-${{ inputs.image-tag }}
          path: image-release.json
          if-no-files-found: error
