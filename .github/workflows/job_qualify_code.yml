name: Qualify Code

on:
  workflow_call:
    inputs:
      PYTHONVERSION:
        required: true
        description: Python version to use
        type: string

jobs:
  qualify_code:
    runs-on: ubuntu-latest
    env:
      FITNESS_TRACKER_DATA_DIR: data

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.PYTHONVERSION }}

      - name: Install Poetry
        run: pip install poetry==2.2.1

      - name: Cache project environment
        uses: actions/cache@v4
        with:
          path: .venv
          key: ${{ runner.os }}-py${{ inputs.PYTHONVERSION }}-${{ hashFiles('poetry.lock') }}

      - name: Install locked dependencies
        run: |
          poetry config virtualenvs.in-project true
          poetry install --with analytics,integrations,docs

      - name: Cache mypy dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/mypy
          key: ${{ runner.os }}-mypy-${{ hashFiles('**/mypy.ini') }}
          restore-keys: ${{ runner.os }}-mypy-

      - name: Check poetry version
        run: poetry --version

      - name: Lint with Ruff
        run: poetry run ruff check src test

      - name: Static type checks with mypy
        run: make -f .config/Makefile static-type-checks

      - name: wily build and rank
        run: make -f .config/Makefile wily-build-and-rank

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          version: v0.10.0
          ignore_paths: >-
            site-packages
          ignore_names: site-packages

      - name: yamllint workout_programs
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: "./docs/project_docs/Workout-Programs/workout_programs.yml"

      - name: Run tests
        run: poetry run pytest --rootdir=$(pwd) test/ --cov --cov-report=xml

      - name: Upload results to Codecov
        uses: codecov/codecov-action@v6
        with:
          slug: TheNewThinkTank/fitness-tracker
          verbose: true

      - uses: rojopolis/spellcheck-github-actions@0.60.0
        name: Spellcheck
        with:
          config_path: .config/.spellcheck.yml
          source_files: README.md
          task_name: Markdown
