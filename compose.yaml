name: fitness-tracker

services:
  backend:
    build:
      context: .
      target: runtime
    image: fitness-tracker-backend:local
    init: true
    environment:
      FITNESS_TRACKER_ALLOWED_ORIGINS: "[]"
      FITNESS_TRACKER_API_TOKEN: "${FITNESS_TRACKER_API_TOKEN:-}"
      FITNESS_TRACKER_DATA_DIR: /data
    volumes:
      - ./data:/data:ro
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - app

  frontend:
    build:
      context: ./frontend
      target: runtime
    image: fitness-tracker-frontend:local
    init: true
    environment:
      FITNESS_TRACKER_API_TOKEN: "${FITNESS_TRACKER_API_TOKEN:-}"
    ports:
      - "127.0.0.1:3000:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --output-document=-
        - http://127.0.0.1:8080/healthz
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - app

networks:
  app:
    driver: bridge
