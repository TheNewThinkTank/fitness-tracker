name: Generate OpenAPI JSON

permissions:
  contents: write

on:
  workflow_dispatch:

jobs:
  generate-openapi:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Poetry
        run: pip install poetry==2.2.1

      - name: Install locked API dependencies
        run: poetry install --only main

      - name: Run OpenAPI generation script
        env:
          PYTHONPATH: ${{ github.workspace }}/src  # Set the PYTHONPATH
        run: |
          poetry run ./bin/generate_openapi.sh

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/project_docs/dev-docs/API-Schema/openapi.json docs/project_docs/dev-docs/API-Schema/openapi.yaml
          git diff --cached --quiet || git commit -m "docs: update OpenAPI schema"
          git push
