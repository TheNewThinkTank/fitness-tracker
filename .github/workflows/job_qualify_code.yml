name: Qualify Code

on:
  workflow_call:
    inputs:
      PYTHONVERSION:
        required: true
        description: Python version to use
        type: string

jobs:
  qualify_code:
    runs-on: ubuntu-latest
    env:
      FITNESS_TRACKER_DATA_DIR: data

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.PYTHONVERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.6"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --locked --all-groups --python "${{ inputs.PYTHONVERSION }}"

      - name: Cache mypy dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/mypy
          key: ${{ runner.os }}-mypy-${{ hashFiles('**/mypy.ini') }}
          restore-keys: ${{ runner.os }}-mypy-

      - name: Check uv version
        run: uv --version

      - name: Lint with Ruff
        run: uv run --locked ruff check --config .config/ruff.toml src oxygen test

      - name: Check API and workout schema contracts
        run: uv run --locked ./bin/generate_openapi.sh --check

      - name: Static type checks with mypy
        run: make -f .config/Makefile static-type-checks

      - name: Check Oxygen entry points
        run: |
          uv run --locked oxygen --help
          uv run --locked python -m oxygen --help

      - name: wily build and rank
        run: make -f .config/Makefile wily-build-and-rank

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          version: v0.10.0
          ignore_paths: >-
            site-packages
          ignore_names: site-packages

      - name: yamllint workout_programs
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: "./docs/project_docs/Workout-Programs/workout_programs.yml"

      - name: Run tests
        run: uv run --locked pytest --rootdir="$PWD" test/ --cov --cov-report=xml

      - name: Test CLI behavior
        run: |
          sudo -n apt-get update
          sudo -n apt-get install --yes bats
          bats bin/test_fitcli.bats

      - name: Upload results to Codecov
        uses: codecov/codecov-action@v4
        with:
          slug: TheNewThinkTank/fitness-tracker
          verbose: true

      - uses: rojopolis/spellcheck-github-actions@0.60.0
        name: Spellcheck
        with:
          config_path: .config/.spellcheck.yml
          source_files: README.md
          task_name: Markdown
