---
name: Fitness Tracker Simulation Workflow

on:
  workflow_dispatch:
  push:
    branches:
      - feature/simulations
    paths:
      - "src/simulations/**"
      - "test/simulations/**"
      - ".github/workflows/simulation-wf.yml"

jobs:
  qualify_code:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # - name: Install pipenv
      #   run: |
      #     python -m pip install --upgrade pipenv wheel
      # - id: cache-pipenv
      #   uses: actions/cache@v4
      #   with:
      #     path: ~/.local/share/virtualenvs
      #     key: ${{ runner.os }}-pipenv-${{ hashFiles('**/Pipfile.lock') }}

      # - name: Install dependencies
      #   if: steps.cache-pipenv.outputs.cache-hit != 'true'
      #   run: |
      #     pipenv install --deploy --dev

      - name: Install Poetry and simulation dependencies
        run: |
          pip install poetry==2.2.1
          poetry install --with analytics

      - name: Lint simulations
        run: poetry run ruff check --config .config/ruff.toml src/simulations test/simulations

      # - name: install pyyaml and pandas
      #   run: |
      #     pipenv install pyyaml pandas

      - name: Run (simulations) test suite
        run: poetry run pytest test/simulations -v
