---
name: Fitness Tracker Simulation Workflow

on:
  workflow_dispatch:
  push:
    branches:
      - feature/simulations
    paths:
      - "src/simulations/**"
      - "test/simulations/**"
      - ".github/workflows/simulation-wf.yml"

jobs:
  qualify_code:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.6"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked simulation dependencies
        run: uv sync --locked --group analytics

      - name: Lint simulations
        run: uv run --locked --group analytics ruff check --config .config/ruff.toml src/simulations test/simulations

      - name: Run (simulations) test suite
        run: uv run --locked --group analytics pytest test/simulations -v
