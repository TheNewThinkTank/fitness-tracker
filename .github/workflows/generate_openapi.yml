name: Generate OpenAPI JSON

permissions:
  contents: write

on:
  workflow_dispatch:

jobs:
  generate-openapi:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.6"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked API dependencies
        run: uv sync --locked --no-dev

      - name: Run OpenAPI generation script
        env:
          PYTHONPATH: ${{ github.workspace }}/src  # Set the PYTHONPATH
        run: |
          uv run --locked --no-dev ./bin/generate_openapi.sh

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/project_docs/dev-docs/API-Schema/openapi.json docs/project_docs/dev-docs/API-Schema/openapi.yaml
          git diff --cached --quiet || git commit -m "docs: update OpenAPI schema"
          git push
